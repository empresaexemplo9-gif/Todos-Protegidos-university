  <style>
    .prop-filtros { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
    .prop-chip { border: 1.5px solid var(--tp-line); background: #fff; color: var(--tp-slate); border-radius: var(--tp-radius-pill); padding: 7px 14px; font: inherit; font-size: var(--tp-fs-sm); font-weight: 600; cursor: pointer; transition: all var(--tp-transition); }
    .prop-chip:hover { border-color: var(--tp-blue-300); }
    .prop-chip.active { background: var(--tp-blue-500); border-color: var(--tp-blue-500); color: #fff; }
    .st { display: inline-block; padding: 3px 10px; border-radius: var(--tp-radius-pill); font-size: var(--tp-fs-xs); font-weight: 700; }
    .st-rascunho { background: var(--tp-bg-alt); color: var(--tp-slate); }
    .st-enviada  { background: var(--tp-blue-50); color: var(--tp-blue-600); }
    .st-aceita   { background: var(--tp-green-50); color: var(--tp-green-700); }
    .st-recusada { background: #fdecec; color: #b3261e; }
    .prop-acts { display: flex; gap: 6px; justify-content: flex-end; }
  </style>
</head>

    <div class="main">

          <div>
            <div class="crumb">Sona · Propostas</div>
            <h2 style="margin:0">Propostas comerciais</h2>
            <p class="mb-0 muted">Crie, envie e acompanhe suas propostas.</p>
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap">
            <a class="btn btn-primary btn-sm" href="proposta.html?id=novo">+ Nova proposta</a>
          </div>
        </div>

        <div id="propostasResumo" class="kpis" style="margin-bottom:18px"></div>
        <div id="propostasFiltro" class="prop-filtros"></div>
        <div id="propostasRoot"></div>
      </main>
    </div>
  </div>
