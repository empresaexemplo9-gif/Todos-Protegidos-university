<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proposta — Sona</title>
  <meta name="description" content="Criar / editar proposta comercial.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#2536cf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sona">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/internal.css">
  <style>
    .field { margin-bottom: 14px; }
    .field label { display: block; font-family: var(--tp-font-sans); font-weight: 600; font-size: var(--tp-fs-sm); margin-bottom: 6px; color: var(--tp-ink); }
    .field input, .field select, .field textarea { width: 100%; padding: 11px 13px; border: 1.5px solid var(--tp-line); border-radius: var(--tp-radius-sm); font: inherit; color: var(--tp-ink); background: #fff; }
    .field textarea { min-height: 78px; resize: vertical; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--tp-green-400); box-shadow: var(--tp-ring); }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .pf-itens-head { display: grid; grid-template-columns: 1fr 80px 130px 120px 34px; gap: 10px; font-size: var(--tp-fs-xs); color: var(--tp-muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 2px 8px; }
    .pf-itens { display: grid; gap: 8px; }
    .pf-item { display: grid; grid-template-columns: 1fr 80px 130px 120px 34px; gap: 10px; align-items: center; }
    .pf-item input { width: 100%; padding: 9px 11px; border: 1.5px solid var(--tp-line); border-radius: var(--tp-radius-sm); font: inherit; font-size: var(--tp-fs-sm); background: #fff; color: var(--tp-ink); }
    .pf-item input:focus { outline: none; border-color: var(--tp-green-400); box-shadow: var(--tp-ring); }
    .pf-lt { font-weight: 700; font-size: var(--tp-fs-sm); text-align: right; color: var(--tp-ink); white-space: nowrap; }
    .pf-rm { border: 0; background: transparent; color: var(--tp-muted); cursor: pointer; font-size: 20px; line-height: 1; }
    .pf-rm:hover { color: var(--tp-danger); }
    .pf-resumo { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-top: 16px; flex-wrap: wrap; }
    .pf-desc { max-width: 220px; margin: 0; }
    .pf-total-box { text-align: right; }
    .pf-total-box span { display: block; font-size: var(--tp-fs-sm); color: var(--tp-muted); }
    .pf-total-box strong { font-family: var(--tp-font-sans); font-size: var(--tp-fs-2xl); color: var(--tp-ink); }
    .form-actions { display: flex; gap: 12px; margin-top: 4px; flex-wrap: wrap; }
    .form-msg { display: none; padding: 11px 14px; border-radius: var(--tp-radius-sm); font-size: var(--tp-fs-sm); margin-bottom: 14px; }
    .form-msg.show { display: block; }
    .form-msg.err { background: #fde6e6; color: var(--tp-danger); }
    .form-msg.ok { background: var(--tp-green-50); color: var(--tp-green-700); }
    @media (max-width: 640px) { .grid2 { grid-template-columns: 1fr; } .pf-itens-head { display: none; } .pf-item { grid-template-columns: 1fr 1fr; row-gap: 6px; } .pf-lt { text-align: left; } }
  </style>
</head>
<body class="dash">
  <div class="app">
    <aside id="sidebar-root" class="sidebar" data-active="propostas"><noscript><a href="propostas.html">Propostas</a></noscript></aside>

    <div class="main">
      <header id="topbar-root" class="topbar" data-title="Proposta"></header>

      <main class="content">
        <div class="page-head">
          <div>
            <div class="crumb"><a href="propostas.html">Propostas</a> · <span id="propCrumb">Nova proposta</span></div>
            <h2 id="propFormTitle" style="margin:0">Nova proposta</h2>
          </div>
          <div><a href="propostas.html" class="btn btn-ghost btn-sm">← Voltar</a></div>
        </div>

        <div id="propFormMsg" class="form-msg"></div>

        <form id="propostaForm" novalidate>
          <div class="panel">
            <div class="grid2">
              <div class="field"><label for="p_titulo">Título da proposta</label><input id="p_titulo" type="text" placeholder="Ex.: Proposta de serviços" required></div>
              <div class="field"><label for="p_validade">Validade</label><input id="p_validade" type="date"></div>
            </div>
            <div class="grid2">
              <div class="field"><label for="p_cliente_nome">Cliente</label><input id="p_cliente_nome" type="text" placeholder="Nome do cliente/empresa"></div>
              <div class="field"><label for="p_cliente_documento">Documento (CNPJ/CPF)</label><input id="p_cliente_documento" type="text" placeholder="Opcional"></div>
            </div>
            <div class="grid2">
              <div class="field"><label for="p_cliente_email">E-mail do cliente</label><input id="p_cliente_email" type="email" placeholder="cliente@email.com"></div>
              <div class="field"><label for="p_cliente_telefone">Telefone do cliente</label><input id="p_cliente_telefone" type="tel" placeholder="(00) 00000-0000"></div>
            </div>
            <div class="field" style="max-width:260px"><label for="p_status">Status</label>
              <select id="p_status">
                <option value="rascunho">Rascunho</option>
                <option value="enviada">Enviada</option>
                <option value="aceita">Aceita</option>
                <option value="recusada">Recusada</option>
              </select>
            </div>
          </div>

          <div class="panel">
            <div class="panel-head">
              <h3>Itens</h3>
              <button type="button" class="btn btn-ghost btn-sm" id="addItem">+ Item</button>
            </div>
            <div class="pf-itens-head"><span>Descrição</span><span>Qtd</span><span>Valor unit.</span><span>Total</span><span></span></div>
            <div id="propItens" class="pf-itens"></div>
            <div class="pf-resumo">
              <div class="field pf-desc"><label for="p_desconto">Desconto (R$)</label><input id="p_desconto" type="number" min="0" step="0.01" value="0"></div>
              <div class="pf-total-box"><span>Total</span><strong id="propTotal">R$ 0,00</strong></div>
            </div>
          </div>

          <div class="panel">
            <div class="field"><label for="p_obs">Observações</label><textarea id="p_obs" placeholder="Notas internas ou visíveis na proposta..."></textarea></div>
            <div class="field" style="margin-bottom:0"><label for="p_cond">Condições comerciais</label><textarea id="p_cond" placeholder="Prazo, forma de pagamento, garantias..."></textarea></div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Salvar proposta</button>
            <a href="propostas.html" class="btn btn-ghost">Cancelar</a>
          </div>
        </form>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
