# ============================================================
# TODOS PROTEGIDOS — configuração das Edge Functions
#
# Serve para o Supabase CLI publicar cada função com o porteiro
# ("Verify JWT") do jeito certo, sem precisar lembrar de flags:
#
#   supabase functions deploy powercrm-webhook
#
# Quem publica pelo navegador (Deploy via Editor) precisa desmarcar
# "Verify JWT" na tela da função — este arquivo não alcança o painel.
# ============================================================

# Recebe os webhooks do Power CRM. Quem chama é o Power CRM, que não
# tem (nem deve ter) token do Supabase: a autenticação é o ?token=
# conferido dentro da própria função contra POWERCRM_WEBHOOK_TOKEN.
# Com o porteiro ligado, a chamada morre antes de chegar no código,
# com {"code":"UNAUTHORIZED_NO_AUTH_HEADER"}.
[functions.powercrm-webhook]
verify_jwt = false

# Ponte da plataforma para a API do Power CRM. Aqui o porteiro FICA
# LIGADO de propósito: quem chama é o navegador do administrador
# logado, e a função ainda confere o papel em profiles.role.
[functions.powercrm-api]
verify_jwt = true
