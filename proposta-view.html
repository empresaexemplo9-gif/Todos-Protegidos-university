<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizar proposta — Sona</title>
  <meta name="description" content="Visualização da proposta comercial.">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <meta name="theme-color" content="#2536cf">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/img/icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sona">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/internal.css">
  <style>
    .pv-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
    .st { display: inline-block; padding: 4px 12px; border-radius: var(--tp-radius-pill); font-size: var(--tp-fs-xs); font-weight: 700; }
    .st-rascunho { background: var(--tp-bg-alt); color: var(--tp-slate); }
    .st-enviada  { background: var(--tp-blue-50); color: var(--tp-blue-600); }
    .st-aceita   { background: var(--tp-green-50); color: var(--tp-green-700); }
    .st-recusada { background: #fdecec; color: #b3261e; }
    .prop-doc { max-width: 820px; background: #fff; border: 1px solid var(--tp-line); border-radius: var(--tp-radius-lg); padding: 34px 38px; box-shadow: var(--tp-shadow-sm); }
    .pd-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; border-bottom: 2px solid var(--tp-line); padding-bottom: 18px; margin-bottom: 20px; }
    .pd-head img { height: 32px; }
    .pd-meta { text-align: right; font-size: var(--tp-fs-sm); color: var(--tp-slate); }
    .pd-title { font-family: var(--tp-font-sans); font-size: var(--tp-fs-2xl); margin: 0 0 4px; color: var(--tp-ink); }
    .pd-cliente { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 24px; margin: 16px 0 24px; font-size: var(--tp-fs-sm); }
    .pd-cliente .k { color: var(--tp-muted); margin-right: 6px; }
    table.pd-itens { width: 100%; border-collapse: collapse; }
    table.pd-itens th { text-align: left; font-size: var(--tp-fs-xs); text-transform: uppercase; letter-spacing: .04em; color: var(--tp-muted); border-bottom: 1px solid var(--tp-line); padding: 8px 6px; }
    table.pd-itens td { padding: 10px 6px; border-bottom: 1px solid var(--tp-line); font-size: var(--tp-fs-sm); color: var(--tp-ink); }
    table.pd-itens .num, table.pd-itens th.num { text-align: right; white-space: nowrap; }
    .pd-tot { text-align: right; margin-top: 16px; }
    .pd-tot .lbl { font-size: var(--tp-fs-sm); color: var(--tp-muted); }
    .pd-tot .v { font-family: var(--tp-font-sans); font-size: var(--tp-fs-2xl); font-weight: 800; color: var(--tp-ink); margin-left: 10px; }
    .pd-sec { margin-top: 22px; }
    .pd-sec h4 { margin: 0 0 6px; font-family: var(--tp-font-sans); font-size: var(--tp-fs-base); color: var(--tp-ink); }
    .pd-sec p { margin: 0; white-space: pre-line; color: var(--tp-slate); font-size: var(--tp-fs-sm); line-height: 1.65; }
    @media print {
      .sidebar, .topbar, .nav-burger, .nav-overlay, .no-print { display: none !important; }
      .app { display: block; }
      .main { margin: 0; }
      .content { padding: 0 !important; }
      body { background: #fff; }
      .prop-doc { border: 0; box-shadow: none; border-radius: 0; padding: 0; max-width: none; }
    }
  </style>
</head>
<body class="dash">
  <div class="app">
    <aside id="sidebar-root" class="sidebar" data-active="propostas"><noscript><a href="propostas.html">Propostas</a></noscript></aside>

    <div class="main">
      <header id="topbar-root" class="topbar" data-title="Visualizar proposta"></header>

      <main class="content">
        <div class="pv-actions no-print">
          <a href="propostas.html" class="btn btn-ghost btn-sm">← Voltar</a>
          <a id="pvEdit" href="#" class="btn btn-ghost btn-sm">Editar</a>
          <button type="button" id="pvPrint" class="btn btn-primary btn-sm">🖨️ Imprimir / Salvar PDF</button>
        </div>
        <div id="propostaView"><div class="gestao-empty" style="padding:40px">Carregando proposta…</div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
